<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Static fallback SEO tags. This app is a pure client-side-rendered
         Vite SPA (no SSR/prerendering) — react-helmet-async (see
         client/src/seo/Seo.jsx) overwrites these per-route for crawlers
         that execute JavaScript (Googlebot does), but link-preview bots
         that do NOT execute JS (Facebook/WhatsApp/LinkedIn/Slack, etc.)
         only ever see exactly what's written here. Keep this accurate and
         brand-generic; it is the permanent fallback for the homepage and
         for any route a non-JS crawler visits directly. -->
    <meta name="description" content="KUWIFR — certified health & wellness supplements, alkaline water devices, fashion, and smart EV mobility. Shop genuine products with nationwide delivery." />
    <link rel="canonical" href="https://kuwifr.in/" />
    <meta property="og:site_name" content="KUWIFR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KUWIFR — Health, Wellness & Lifestyle Essentials" />
    <meta property="og:description" content="Certified health & wellness supplements, alkaline water devices, fashion, and smart EV mobility from KUWIFR Services Pvt Ltd." />
    <meta property="og:url" content="https://kuwifr.in/" />
    <meta property="og:image" content="https://kuwifr.in/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KUWIFR — Health, Wellness & Lifestyle Essentials" />
    <meta name="twitter:description" content="Certified health & wellness supplements, alkaline water devices, fashion, and smart EV mobility from KUWIFR Services Pvt Ltd." />
    <meta name="twitter:image" content="https://kuwifr.in/logo.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KUWIFR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Geist + Geist Mono: the EXACT font family PBW Foundation's dashboard uses (confirmed by
         reading its live computed styles: --font-sans: "Geist"; --font-mono: "Geist Mono").
         Used by the redesigned Member Dashboard page. Loaded alongside Inter so the rest of the
         site keeps its current font until it is redesigned too. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>KUWIFR Services Pvt Ltd | Health, Wellness & Lifestyle Essentials</title>
  </head>
  <body>
